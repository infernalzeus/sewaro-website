name: Deploy Sewaro to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sewaro-cloudflare-production

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check site files
        run: test -s dist/index.html
      - name: Read Cloudflare production branch
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/sewaro-maidstone" \
            | jq -er '.result.production_branch | strings | select(length > 0)')
          git check-ref-format --branch "$branch" >/dev/null
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sewaro-maidstone --branch=${{ steps.pages.outputs.branch }}
